<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="papyrusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="85%" stop-color="#f5efe0" />
      <stop offset="100%" stop-color="#eae0cc" />
    </radialGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb76c" />
      <stop offset="50%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#8a6408" />
    </linearGradient>
  </defs>
  
  <!-- Outer warm parchment circle -->
  <circle cx="256" cy="256" r="248" fill="url(#papyrusGrad)" stroke="#112338" stroke-width="12" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#b8860b" stroke-width="3" stroke-dasharray="4 4" />
  
  <!-- Degree marks ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#112338" stroke-width="2" />
  
  <!-- Compass spokes -->
  <g stroke="#112338" stroke-width="6" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="36" x2="256" y2="476" />
    <line x1="36" y1="256" x2="476" y2="256" />
    <line x1="100" y1="100" x2="412" y2="412" />
    <line x1="100" y1="412" x2="412" y2="100" />
  </g>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#brassGrad)" stroke-width="6" />
  
  <!-- Compass Rose Points -->
  <!-- North (Deep Navy / Red accent) -->
  <polygon points="256,48 244,236 256,210" fill="#991b1b" />
  <polygon points="256,48 268,236 256,210" fill="#112338" />
  
  <!-- South -->
  <polygon points="256,464 244,276 256,302" fill="#64748b" />
  <polygon points="256,464 268,276 256,302" fill="#112338" />
  
  <!-- East -->
  <polygon points="464,256 276,244 302,256" fill="url(#brassGrad)" />
  <polygon points="464,256 276,268 302,256" fill="#112338" />
  
  <!-- West -->
  <polygon points="48,256 236,244 210,256" fill="url(#brassGrad)" />
  <polygon points="48,256 236,268 210,256" fill="#112338" />
  
  <!-- Diagonal points (NE, NW, SE, SW) -->
  <polygon points="403,109 265,247 285,227" fill="#b8860b" />
  <polygon points="109,109 247,247 227,227" fill="#112338" />
  <polygon points="403,403 265,265 285,285" fill="#112338" />
  <polygon points="109,403 247,265 227,285" fill="#b8860b" />
  
  <!-- Central Hub -->
  <circle cx="256" cy="256" r="48" fill="#112338" stroke="url(#brassGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="32" fill="#fdfbf7" />
  <circle cx="256" cy="256" r="14" fill="#b8860b" />
        
  <!-- Cardinal labels in classic serif -->
  <text x="256" y="38" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#991b1b" text-anchor="middle">N</text>
  <text x="256" y="498" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#112338" text-anchor="middle">S</text>
  <text x="496" y="265" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#112338" text-anchor="middle">E</text>
  <text x="20" y="265" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#112338" text-anchor="middle">W</text>
</svg>
